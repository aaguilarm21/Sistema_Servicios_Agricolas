<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para el amor de mi vida</title>
    <style>
      :root {
        --paper: #f2ece9;
        --paper2: #eae0dc;
        --ink: #4a3b3a;
        --rose: #b15b44;
        --rose-dark: #8e4130;
        --shadow: rgba(117, 89, 80, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ded3cd;
        font-family: Georgia, "Times New Roman", serif;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: linear-gradient(180deg, #f4efe9 0%, #efe6e0 100%);
        position: relative;
        overflow: hidden;
        padding: 0;
      }

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .paper {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.12);
        padding: 26px 20px 32px;
      }

      .heart {
        font-size: clamp(2.2rem, 6vw, 3.2rem);
        color: var(--rose);
        opacity: 0.9;
        margin-bottom: 18px;
        line-height: 1;
      }

      .text {
        width: min(82%, 300px);
        text-align: center;
        color: rgba(74, 59, 58, 0.95);
        font-style: italic;
        font-size: clamp(1.8rem, 4vw, 2.7rem);
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: 0.02em;
        margin: 0 0 32px;
      }

      .pill {
        width: min(72%, 280px);
        background: linear-gradient(135deg, #a8573e, #8f432d);
        border-radius: 999px;
        color: #f7f2ee;
        font-size: clamp(1.4rem, 3vw, 2rem);
        text-align: center;
        padding: 18px 14px;
        box-shadow: 0 16px 28px var(--shadow);
        font-style: italic;
        font-weight: 600;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
        display: inline-block;
      }

      .pill:hover,
      .pill:focus-visible {
        transform: translateY(-3px);
        box-shadow: 0 20px 34px var(--shadow);
      }

      .pill:focus-visible {
        outline: 3px solid var(--rose-dark);
        outline-offset: 5px;
      }

      .birthday-screen {
        position: fixed;
        z-index: 10;
        inset: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: #f4e7df;
        text-align: center;
      }

      .birthday-screen[hidden] { display: none; }

      .birthday-content { width: min(100%, 460px); }

      .birthday-gif {
        display: block;
        width: min(100%, 360px);
        height: auto;
        margin: 20px auto 14px;
        border-radius: 8px;
      }

      .birthday-progress {
        width: min(100%, 300px);
        height: 5px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 5px;
        background: #dfc9be;
      }

      .birthday-progress span {
        display: block;
        width: 0;
        height: 100%;
        background: var(--rose);
        animation: birthday-countdown 5s linear forwards;
      }

      @keyframes birthday-countdown {
        to { width: 100%; }
      }

      @media (max-width: 420px) {
        .paper {
          padding-top: 22px;
        }

        .text {
          width: 86%;
          font-size: 2.0rem;
        }

        .pill {
          width: 76%;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <div class="paper">
          <div class="heart">❤</div>
          <div class="text">Para el amor de mi vida</div>
          <a class="pill" href="fotos.html">Te amo...</a>
        </div>
      </div>
    </div>
    <section class="birthday-screen" id="birthday-screen" aria-label="FELIZ CUMPLEAÑOS" aria-live="assertive" tabindex="-1" hidden>
      <div class="birthday-content">
        <img class="birthday-gif" src="cumpleanos.gif" alt="FELIZ CUMPLEAÑOS" />
        <div class="birthday-progress" aria-hidden="true"><span></span></div>
      </div>
    </section>
    <script>
      const loveLink = document.querySelector(".pill");
      const birthdayScreen = document.querySelector("#birthday-screen");
      let isNavigating = false;

      loveLink.addEventListener("click", (event) => {
        event.preventDefault();
        if (isNavigating) return;

        isNavigating = true;
        birthdayScreen.hidden = false;
        birthdayScreen.focus();
        window.setTimeout(() => window.location.assign(loveLink.href), 5000);
      });
    </script>
  </body>
</html>
